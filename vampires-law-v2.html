<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire's Law</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0910;color:#ead9d1;font:16px Georgia,serif}button{background:#651c34;color:white;border:1px solid #ad6473;border-radius:9px;padding:12px;margin:4px;font-size:15px}button:disabled{opacity:.4}.hidden{display:none!important}#start{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#502035,#0b0910 70%)}h1{color:#efb6bc;font-size:42px}h2{color:#e9b4bc}#game{max-width:700px;margin:auto;padding:14px}.stats{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap;background:#2b1b29;padding:12px;border-radius:10px}.castle{margin-top:15px;background:linear-gradient(#181827,#49323b);border:3px solid #8b5861;border-radius:12px;padding:15px;position:relative}.moon{height:60px;text-align:right;font-size:45px}.towers{text-align:center;font-size:45px}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:9px}.room{height:110px;border:2px solid #9c6d73;background:#30232d;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:7px;text-align:center}.room.empty{border-color:#49383f;color:#9b8a8b}.room span{font-size:29px}.panel{background:#241a26;border:1px solid #644450;border-radius:12px;padding:12px;margin-top:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.actions button{margin:0}.small{font-size:13px;color:#d4b9be}.log{max-height:110px;overflow:auto}.log p{margin:7px 0}input{width:100%;accent-color:#ae4963}
</style></head><body>
<section id="start"><div style="font-size:70px">🦇</div><h1>Vampire's Law</h1><p>Erwache. Errichte dein Schloss. Beherrsche die Nacht.</p><button onclick="startGame()" style="font-size:22px">Spiel starten</button></section>
<main id="game" class="hidden"><h2>🦇 Vampire's Law</h2><div class="stats"><b>🩸 Blut: <span id="blood"></span></b><b>✦ Macht: <span id="power"></span></b><b>🦇 Clan: <span id="clan"></span></b></div>
<div class="castle"><div class="moon">🌕</div><div class="towers">🏰</div><div class="rooms" id="rooms"></div></div>
<div class="panel"><b>Schlossebenen</b><div class="actions"><button onclick="changeFloor(-1)">◀ Ebene zurück</button><button onclick="changeFloor(1)">Nächste Ebene ▶</button></div><p id="floorLabel" class="small"></p></div>
<div class="panel"><b>⏳ Zeitscroller</b><p class="small">Bewege den Regler durch die Epochen deines Schlosses.</p><input id="time" type="range" min="0" max="2" value="0" oninput="setEra(+this.value)"><p id="era"></p></div>
<div class="panel"><h2>Dein Clan</h2><div class="actions"><button onclick="hunt()">🩸 Jagen (+12 Blut)</button><button onclick="recruit()">🦇 Vampir erschaffen (30 Blut)</button><button onclick="build()">🏰 Raum bauen (40 Blut)</button><button onclick="document.getElementById('research').scrollIntoView()">🔬 Forschung</button></div><p class="small">Macht steigt dauerhaft und wird nicht verbraucht.</p></div>
<div class="panel" id="research"><h2>🔬 Forschung</h2><div id="tech"></div></div>
<div class="panel"><h2>📜 Chronik</h2><div id="log" class="log"></div><button onclick="resetGame()">Neues Spiel</button></div></main>
<script>
const key='vampires-law-v2';const fresh=()=>({blood:25,power:1,clan:1,rooms:2,floor:0,era:0,tech:[],log:['Dein Clan erwacht in der Dunkelheit.']});let s=fresh();
const names=[['⚰️','Gruft'],['🔬','Forschungsraum'],['🩸','Blutkammer'],['⚔️','Waffenkammer'],['🕯️','Ritualraum'],['🦇','Clanquartier'],['👑','Thronsaal'],['🔮','Artefaktkammer'],['📜','Bibliothek'],['🛡️','Wache'],['🧪','Alchemie'],['🦇','Halle']];
const research=[['Hypnose',25,2],['Verstärkte Waffen',35,3],['Menschenbeherrschung',55,5],['Blutamulett',70,7],['Clanbindung',80,9]];
function note(x){s.log.unshift(x);s.log=s.log.slice(0,20)}function save(){localStorage.setItem(key,JSON.stringify(s));render()}
function startGame(){try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch(e){s=fresh()}document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function hunt(){s.blood+=12;s.power++;note('Jagd erfolgreich: +12 Blut, +1 Macht.');save()}
function recruit(){if(s.blood<30)return alert('Nicht genug Blut.');if(s.clan>=3+(s.tech.includes('Clanbindung')?3:0))return alert('Erforsche Clanbindung für mehr Vampire.');s.blood-=30;s.clan++;s.power+=2;note('Ein neuer Vampir wurde erschaffen.');save()}
function build(){if(s.blood<40)return alert('Du brauchst 40 Blut.');if(s.rooms>=12)return alert('Alle Räume gebaut.');s.blood-=40;s.rooms++;s.power++;note('Ein neuer Raum wurde gebaut.');save()}
function unlock(i){let [n,c,m]=research[i];if(s.tech.includes(n))return;if(s.power<m)return alert('Du brauchst '+m+' Macht.');if(s.blood<c)return alert('Du brauchst '+c+' Blut.');s.blood-=c;s.tech.push(n);note('Erforscht: '+n);save()}
function changeFloor(d){s.floor=Math.max(0,Math.min(2,s.floor+d));save()}
function setEra(v){s.era=v;save()}
function resetGame(){if(confirm('Spielstand zurücksetzen?')){s=fresh();save()}}
function render(){document.getElementById('blood').textContent=s.blood;document.getElementById('power').textContent=s.power;document.getElementById('clan').textContent=s.clan+'/'+(3+(s.tech.includes('Clanbindung')?3:0));document.getElementById('floorLabel').textContent='Ebene '+(s.floor+1)+' von 3';document.getElementById('time').value=s.era;document.getElementById('era').textContent=['Ursprung · Jahr 1200','Dunkles Zeitalter · Jahr 1600','Gegenwart · Jahr 2026'][s.era];document.getElementById('rooms').innerHTML=Array.from({length:4},(_,i)=>{let n=s.floor*4+i;return n<s.rooms?'<div class="room"><span>'+names[n][0]+'</span>'+names[n][1]+'</div>':'<div class="room empty"><span>🔒</span>Ungebauter Raum</div>'}).join('');document.getElementById('tech').innerHTML=research.map(([n,c,m],i)=>'<button '+(s.tech.includes(n)?'disabled':'')+' onclick="unlock('+i+')">'+n+' · '+c+' Blut · Macht '+m+(s.tech.includes(n)?' ✓':'')+'</button>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('')}
</script></body></html>
